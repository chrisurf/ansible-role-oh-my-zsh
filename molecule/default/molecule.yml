---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
# Driven by the MOLECULE_DISTRO env var so a single scenario can be run
# against multiple distributions from CI (see .github/workflows/ci.yml).
# Images are the systemd-enabled geerlingguy/docker-*-ansible images.
- name: "omz-${MOLECULE_DISTRO:-ubuntu2204}"
  image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2204}-ansible:latest"
  volumes:
  - /sys/fs/cgroup:/sys/fs/cgroup:rw
  cgroupns_mode: host
  privileged: true
  pre_build_image: true
provisioner:
  name: ansible
verifier:
  name: ansible
...
